<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account – PARKNOVA</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-root="">

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo">
        <i class="fa-solid fa-square-parking"></i>
        <span>PARK</span>NOVA
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="find-parking.html">Find Parking</a>
      </nav>
      <div class="nav-cta">
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <!-- Auth Content Wrapper -->
  <main class="auth-wrapper">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-header">
        <div class="brand-logo">
          <i class="fa-solid fa-square-parking"></i>
          <span>PARK</span>NOVA
        </div>
        <h1>Create Your Account</h1>
        <p>Join India's smart parking discovery network</p>
      </div>

      <!-- Role Selector (Driver or Parking Owner Only) -->
      <div class="role-selector" id="reg-role-selector">
        <button type="button" class="role-btn role-driver active" data-role="driver">
          <i class="fa-solid fa-car"></i> I am a Driver
        </button>
        <button type="button" class="role-btn role-owner" data-role="owner">
          <i class="fa-solid fa-building-user"></i> I am a Parking Owner
        </button>
      </div>

      <!-- Registration Form -->
      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name <span class="required">*</span></label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Rahul Sharma" required>
          <div class="field-error"></div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address <span class="required">*</span></label>
            <input type="email" id="reg-email" class="form-control" placeholder="rahul@example.com" autocomplete="email" required>
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-phone">Mobile Number <span class="required">*</span></label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="9876543210" maxlength="10" required>
            <div class="field-error"></div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
            <input type="password" id="reg-password" class="form-control" placeholder="Min 8 chars (letter+digit)" autocomplete="new-password" required>
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password <span class="required">*</span></label>
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Repeat password" autocomplete="new-password" required>
            <div class="field-error"></div>
          </div>
        </div>

        <div style="font-size: 0.75rem; color: var(--navy-muted); margin-bottom: 1.25rem;">
          By registering, you agree that this prototype uses LocalStorage demonstration data and adheres to PARKNOVA fair parking guidelines.
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-reg-btn">
          <i class="fa-solid fa-user-plus"></i> Complete Registration
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/navigation.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let selectedRole = 'driver';
      const roleBtns = document.querySelectorAll('#reg-role-selector .role-btn');
      const form = document.getElementById('register-form');
      const nameInput = document.getElementById('reg-name');
      const emailInput = document.getElementById('reg-email');
      const phoneInput = document.getElementById('reg-phone');
      const passwordInput = document.getElementById('reg-password');
      const confirmInput = document.getElementById('reg-confirm-password');

      const params = PN.app.getQueryParams();
      if (params.role === 'owner') {
        selectedRole = 'owner';
        roleBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.role === 'owner'));
      }

      roleBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          selectedRole = btn.dataset.role;
          roleBtns.forEach(b => b.classList.toggle('active', b === btn));
        });
      });

      const submitBtn = document.getElementById('submit-reg-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        PN.validate.clearErrors(form);

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const phone = phoneInput.value.trim();
        const password = passwordInput.value;
        const confirm = confirmInput.value;

        // Validations
        const nameErr = PN.validate.required(name, 'Full name');
        const emailErr = PN.validate.email(email);
        const phoneErr = PN.validate.phone(phone);
        const passErr = PN.validate.password(password);
        const confirmErr = PN.validate.confirmPassword(password, confirm);

        let isValid = true;
        if (nameErr) { PN.validate.showFieldError(nameInput, nameErr); isValid = false; }
        if (emailErr) { PN.validate.showFieldError(emailInput, emailErr); isValid = false; }
        if (phoneErr) { PN.validate.showFieldError(phoneInput, phoneErr); isValid = false; }
        if (passErr) { PN.validate.showFieldError(passwordInput, passErr); isValid = false; }
        if (confirmErr) { PN.validate.showFieldError(confirmInput, confirmErr); isValid = false; }

        if (!isValid) return;

        const origBtnText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';

        try {
          const res = await PN.auth.register({
            name,
            email,
            phone,
            password,
            role: selectedRole
          });

          if (!res.success) {
            PN.toast(res.message, 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = origBtnText;
            return;
          }

          PN.toast(`Registration successful! Welcome, ${res.user.name}.`, 'success');
          setTimeout(() => {
            window.location.href = res.redirectUrl;
          }, 500);
        } catch (err) {
          PN.toast('Registration error: ' + err.message, 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = origBtnText;
        }
      });
    });
  </script>
</body>
</html>
